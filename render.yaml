services:
  - type: web
    name: clauseiq-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./clauseiq.db
      - key: UPLOAD_DIR
        value: ./uploaded_documents
      - key: CHROMA_DB_DIR
        value: ./chroma_db
      - key: OPENAI_API_KEY
        value: ""
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ADMIN_EMAIL
        value: admin@clauseiq.com
      - key: ADMIN_PASSWORD
        value: AdminSecurePassword2026!
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
